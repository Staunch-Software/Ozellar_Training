# Ozellar Marine — Seafarer Training Portal (static frontend)
# training.ozellar.com — HTTPS via the existing *.ozellar.com wildcard cert.
# Place at: /etc/nginx/sites-available/ozellar and symlink into sites-enabled.

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name training.ozellar.com;
    return 301 https://training.ozellar.com$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name training.ozellar.com;

    ssl_certificate     /etc/ssl/ozellar/fullchain.pem;
    ssl_certificate_key /etc/ssl/ozellar/wildcard_ozellar_com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;
    root /var/www/ozellar;
    index index.html;

    # gzip for text assets (video/images are already compressed)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # SPA: client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed, immutable build assets — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # slide images — 404 if missing (do NOT fall back to index.html)
    location /slides/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # training videos — nginx serves byte-range requests by default (seeking works)
    location /media/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # never cache the entry HTML so redeploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
