# Ozellar Marine — Seafarer Training Portal (static frontend)
# training.ozellar.com — HTTPS via the existing *.ozellar.com wildcard cert.
# Place at: /etc/nginx/sites-available/ozellar and symlink into sites-enabled.

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name training.ozellar.com;
    return 301 https://training.ozellar.com$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name training.ozellar.com;

    ssl_certificate     /etc/ssl/ozellar/fullchain.pem;
    ssl_certificate_key /etc/ssl/ozellar/wildcard_ozellar_com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    server_tokens off;
    root /var/www/ozellar;
    index index.html;

    # Server-wide upload ceiling. The /api/ block below sets its own limit for
    # course-builder uploads; this keeps the same ceiling in place for anything
    # served outside /api/.
    client_max_body_size 2G;

    # gzip for text assets (video/images are already compressed)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # backend API — FastAPI (uvicorn) under systemd on 127.0.0.1:8021.
    # No trailing slash on proxy_pass, so the /api prefix is preserved (the
    # FastAPI routes are defined as /api/...). Mirrors the vessel-api pattern.
    location /api/ {
        proxy_pass http://127.0.0.1:8021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1800s;   # raised from 300 s — must survive a 1.3 GB upload

        # Course-builder PPTX/video uploads. Without these three the default
        # 1 MB body limit rejects every deck with a 413 before a byte of it
        # reaches FastAPI, and a multi-hundred-MB upload trips the send/read
        # timeouts partway through.
        client_max_body_size 2g;
        client_body_timeout 1800s;
        send_timeout 1800s;
        proxy_send_timeout 1800s;

        # Stream the body straight through instead of spooling the whole file
        # to nginx's disk first — otherwise the browser's progress bar hits
        # 100% and then sits there while nginx replays the file to uvicorn.
        proxy_request_buffering off;
    }

    # SPA: client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed, immutable build assets — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # slide images — 404 if missing (do NOT fall back to index.html)
    location /slides/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # training videos — nginx serves byte-range requests by default (seeking works)
    location /media/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # never cache the entry HTML so redeploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
