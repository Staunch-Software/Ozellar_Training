# Ozellar Marine — Seafarer Training Portal (static frontend)
# Place at: /etc/nginx/sites-available/ozellar  and symlink into sites-enabled.
# Serves the built React app from /var/www/ozellar.

server {
    listen 80;
    listen [::]:80;
    server_name _;            # replace with your domain or VM public IP when known

    root /var/www/ozellar;
    index index.html;

    # basic hardening
    server_tokens off;

    # gzip for text assets (video/images are already compressed)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # SPA: client-side routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # hashed, immutable build assets — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # slide images — real files, 404 if missing (do NOT fall back to index.html)
    location /slides/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # training videos — large; nginx serves HTTP byte-range requests by default,
    # so seeking/streaming works. 404 if missing rather than SPA fallback.
    location /media/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # never cache the entry HTML so redeploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
